CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SHELL_STACK_SIZE=4096

# Ethernet with packet sockets only. With no IP stack the board sends nothing by
# itself, so every frame on the wire comes from the "eth" shell command.
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=n
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=n
# Sizes buffers and the MAC for 802.1Q frames: 1518 bytes plus the FCS.
CONFIG_NET_VLAN=y
CONFIG_NET_TCP=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_PACKET=y
# Send frames byte for byte as built: no checksum insertion by the MAC.
CONFIG_NET_CHECKSUM_OFFLOAD=n
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=96
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_ETHERNET=y

# Serial console: shell plus logs
CONFIG_LOG=y
CONFIG_NET_LOG=y
CONFIG_SHELL=y
CONFIG_NET_SHELL=y
CONFIG_CODE_DATA_RELOCATION=y

# IEEE 1588 hardware timestamps on sent and received frames, for "eth ping"
CONFIG_PTP_CLOCK=y
CONFIG_NET_PKT_TIMESTAMP=y
CONFIG_NET_PKT_TIMESTAMP_THREAD=y
CONFIG_NET_CONTEXT_TIMESTAMPING=y
